name: Deploy api to production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: true
        default: 'Manual update and deployment'

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Production
    needs: lint
    runs-on: ubuntu-latest
    # Configure required reviewers on the "production" environment in GitHub to add an approval gate.
    environment: production
    steps:
      - name: Get the latest source code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Display deployment information
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual deployment triggered"
          echo "Reason: ${{ github.event.inputs.reason }}"

      - name: Sync files for Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_MAX_SERVER }}
          username: ${{ secrets.FTP_API_USERNAME_PROD }}
          password: ${{ secrets.FTP_API_PASSWORD_PROD }}
          protocol: ftps
          timeout: 90000
          max-retries: 3
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.env*
            **/tests/**
            **/database/**
            **/cronjobs/**
            **/docker/**
            **/documentation/**
            **/node_modules/**
            **/vendor/**
            .gitignore
            .editorconfig
            compose.yaml
            composer.json
            composer.lock
            phpstan.neon
            CLAUDE.md
            README.md
            LICENSE
            http-client.env.json
            secrets.txt
          state-name: .ftp-deploy-sync-state.json
          server-dir: /
