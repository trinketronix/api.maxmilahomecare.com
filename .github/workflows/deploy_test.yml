name: Deploy api for testing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Test
    needs: lint
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_MAX_SERVER }}
          username: ${{ secrets.FTP_API_USERNAME_TEST }}
          password: ${{ secrets.FTP_API_PASSWORD_TEST }}
          protocol: ftps
          server-dir: /
          timeout: 90000
          max-retries: 2
          log-level: verbose
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.github/**
            **/.env*
            **/tests/**
            **/database/**
            **/cronjobs/**
            **/docker/**
            **/documentation/**
            **/node_modules/**
            **/vendor/**
            .gitignore
            .editorconfig
            compose.yaml
            composer.json
            composer.lock
            phpstan.neon
            CLAUDE.md
            README.md
            LICENSE
            http-client.env.json
            secrets.txt
