# Local development stack. Start with:  docker compose up --build
# API:      http://localhost:8080          (GET / shows environment and database name)
# Mail UI:  http://localhost:8025          (every email the API sends lands here)
# DB:       localhost:3306  maxmila / maxmila  (database maxmila_dev)
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
      API_BASE_URL: http://localhost:8080
      APP_BASE_URL: http://localhost:3000
      DB_HOSTPATH: db
      DB_USERNAME: maxmila
      DB_PASSWORD: maxmila
      DB_DATABASE: maxmila_dev
      EMAIL_HOSTPATH: mailpit
      EMAIL_SERVPORT: "1025"
      EMAIL_SMTPAUTH: "false"
      EMAIL_SMTPSECURE: ""
      EMAIL_USERNAME: ""
      EMAIL_PASSWORD: ""
      EMAIL_REP_ADDR: no-reply-dev@maxmilahomecare.com
      EMAIL_REP_NAME: Maxmila Homecare Dev
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: maxmila_dev
      MARIADB_USER: maxmila
      MARIADB_PASSWORD: maxmila
      TZ: America/Detroit
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # generated by database/build.sh from the per-table files; applied once on first start
      - ./database/tables/reinstall_all.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  dbdata:
